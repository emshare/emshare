[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "em"
version = "0.1.0"
description = "东方财富行情抓取（领域模型在最内层 + 动态代理 + 可选 pandas DataFrame 返回）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]


[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pandas-stubs",
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["em*"]

[tool.setuptools.package-data]
em = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["em"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/em"]
strict = true
warn_unreachable = true