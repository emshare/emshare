[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "emshare"
version = "0.1.1"
description = "行情数据接口：A 股 / 港股 / 指数 / 基金的行情、K 线、资金流、龙虎榜、财报，可选 pandas DataFrame"
# GitHub 首页与 PyPI 项目页共用面向使用者的 README.md；开发文档 README.dev.md 只留本地，不入库
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "emshare contributors" }]
keywords = ["quote", "stock", "akshare", "行情"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31", "urllib3>=2.0,<3"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.scripts]
emshare = "em.cli:main"

# PyPI 项目页侧边栏的链接
[project.urls]
Homepage = "https://github.com/emshare/emshare"
Repository = "https://github.com/emshare/emshare"
Issues = "https://github.com/emshare/emshare/issues"
Changelog = "https://github.com/emshare/emshare/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pandas-stubs",
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["em*"]

[tool.setuptools.package-data]
em = ["py.typed", "env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF", "TID251"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

# 底层 HTTP 调用必须经过明确的网络入口；tests 允许构造替身。
