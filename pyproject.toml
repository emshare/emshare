[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["em"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src/em"]
strict = true
warn_unreachable = true
