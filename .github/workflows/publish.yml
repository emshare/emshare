name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
      - name: Quality gate
        run: |
          # --locked：uv.lock 过期时直接报错，不悄悄重新解析；
          # --extra pandas：不装 pandas 的话 df_* 的测试会被 importorskip 整体跳过。
          uv sync --locked --extra pandas
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)，无需 API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
      - name: Publish
        run: uv publish --trusted-publishing always dist/*
